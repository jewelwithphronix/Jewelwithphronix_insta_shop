<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jewelwithphronix — Handcrafted jewellery</title>
    <meta name="description" content="Handcrafted bracelets and jewellery from Nashik. Order easily on WhatsApp." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Splash screen: shows instantly (before the app loads), fades out when the shop is ready */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #fff; color: #8e2646; text-align: center; padding: 24px;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.splash--out { opacity: 0; visibility: hidden; }
      .splash-seen #splash { display: none; }
      .splash__mark { width: 96px; height: 96px; }
      .splash__ring { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-dasharray: 190; stroke-dashoffset: 190; animation: splash-draw 0.9s ease-out forwards; }
      .splash__ring--inner { stroke-dasharray: 125; stroke-dashoffset: 125; animation-delay: 0.15s; }
      .splash__dot { fill: currentColor; opacity: 0; animation: splash-fade 0.3s ease-out forwards; animation-delay: calc(0.35s + var(--i) * 0.035s); }
      .splash__letter { font: 600 26px "Playfair Display", Georgia, serif; fill: currentColor; opacity: 0; animation: splash-fade 0.5s ease-out 0.6s forwards; }
      .splash__name { margin: 0; font: 500 22px "Lora", Georgia, serif; color: #241c1a; letter-spacing: 0.01em; opacity: 0; animation: splash-rise 0.5s ease-out 0.75s forwards; }
      .splash__tag { margin: -10px 0 0; font: italic 400 15px "Lora", Georgia, serif; color: #6b5d58; opacity: 0; animation: splash-rise 0.5s ease-out 0.9s forwards; }
      .splash__bar { width: 120px; height: 2px; border-radius: 2px; background: #f3e1d8; overflow: hidden; margin-top: 6px; }
      .splash__bar span { display: block; height: 100%; width: 40%; background: #8e2646; border-radius: inherit; animation: splash-load 1.1s ease-in-out infinite; }
      .splash__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        .splash__ring, .splash__dot, .splash__letter, .splash__name, .splash__tag { animation: none; opacity: 1; stroke-dashoffset: 0; }
        .splash__bar { display: none; }
      }
    </style>
    <script>
      // splash only on the first page of a visit
      try { if (sessionStorage.getItem("splashSeen")) document.documentElement.classList.add("splash-seen"); } catch (e) {}
      // safety net: never cover the shop for more than 6s, even if the app fails to load
      setTimeout(function () {
        var el = document.getElementById("splash");
        if (el) { el.classList.add("splash--out"); setTimeout(function () { el.remove(); }, 600); }
      }, 6000);
    </script>
  </head>
  <body>
    <div id="splash" role="status">
      <span class="splash__sr">Loading Jewelwithphronix…</span>
      <svg class="splash__mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <circle class="splash__ring" cx="32" cy="32" r="29" transform="rotate(-90 32 32)" />
        <circle class="splash__ring splash__ring--inner" cx="32" cy="32" r="19" transform="rotate(-90 32 32)" />
          <circle class="splash__dot" style="--i:0" cx="56.50" cy="32.00" r="1.5" />
          <circle class="splash__dot" style="--i:1" cx="54.64" cy="41.38" r="1.5" />
          <circle class="splash__dot" style="--i:2" cx="49.32" cy="49.32" r="1.5" />
          <circle class="splash__dot" style="--i:3" cx="41.38" cy="54.64" r="1.5" />
          <circle class="splash__dot" style="--i:4" cx="32.00" cy="56.50" r="1.5" />
          <circle class="splash__dot" style="--i:5" cx="22.62" cy="54.64" r="1.5" />
          <circle class="splash__dot" style="--i:6" cx="14.68" cy="49.32" r="1.5" />
          <circle class="splash__dot" style="--i:7" cx="9.36" cy="41.38" r="1.5" />
          <circle class="splash__dot" style="--i:8" cx="7.50" cy="32.00" r="1.5" />
          <circle class="splash__dot" style="--i:9" cx="9.36" cy="22.62" r="1.5" />
          <circle class="splash__dot" style="--i:10" cx="14.68" cy="14.68" r="1.5" />
          <circle class="splash__dot" style="--i:11" cx="22.62" cy="9.36" r="1.5" />
          <circle class="splash__dot" style="--i:12" cx="32.00" cy="7.50" r="1.5" />
          <circle class="splash__dot" style="--i:13" cx="41.38" cy="9.36" r="1.5" />
          <circle class="splash__dot" style="--i:14" cx="49.32" cy="14.68" r="1.5" />
          <circle class="splash__dot" style="--i:15" cx="54.64" cy="22.62" r="1.5" />
        <text class="splash__letter" x="32" y="41" text-anchor="middle">J</text>
      </svg>
      <p class="splash__name" aria-hidden="true">Jewelwithphronix</p>
      <p class="splash__tag" aria-hidden="true">The joy of wearing best.</p>
      <div class="splash__bar" aria-hidden="true"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
